name: Build and deploy GH Pages


on:
  push:
    branches:
      - main
    paths:
      - 'landing/**'
      - '.github/workflows/landing.yml'
  pull_request:
    paths:
      - 'landing/**'
      - '.github/workflows/landing.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: build_and_deploy
        uses: shalzz/zola-deploy-action@v0.23.6
        env:
          # Target branch
          PAGES_BRANCH: gh-pages
          BUILD_DIR: ./landing
          # Pull requests only check that the site builds.
          BUILD_ONLY: ${{ github.event_name == 'pull_request' }}
          CHECK_LINKS: true
          CHECK_FLAGS: --skip-external-links
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
