name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr_branch: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName }}
    steps:
      - name: Open or update the release PR, or publish a release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Tags created with GITHUB_TOKEN don't trigger other workflows, so the
  # Docker build's tag trigger wouldn't fire. Dispatching it on the new tag
  # does, and gives it the tag ref it needs for the image's version tags.
  docker:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Build and publish the image for the new tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run docker.yml
          --repo "${{ github.repository }}"
          --ref "${{ needs.release-please.outputs.tag_name }}"

  # The release PR is pushed with GITHUB_TOKEN, which doesn't trigger CI, so
  # its required Check would stay pending. Dispatch CI on its branch instead.
  ci:
    needs: release-please
    if: needs.release-please.outputs.pr_branch
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run CI on the release PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run ci.yml
          --repo "${{ github.repository }}"
          --ref "${{ needs.release-please.outputs.pr_branch }}"
