name: Reset demo

# Redeploying the demo on Render wipes its data, since the free plan has no
# disk, and pulls the latest release image.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK isn't set; skipping."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
